<!doctype html>
<html lang="en">
  <head>
    <script type="text/javascript">
      // Decodes the URL parameter and restores browser history
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>

    <!-- ========================================================== -->
    <!-- Google Consent Mode v2 — MUST run before any GTM/gtag/Meta  -->
    <!-- scripts. Default state is DENIED for all non-essential      -->
    <!-- categories. Consent is updated to GRANTED only after the    -->
    <!-- user makes a positive choice via the cookie banner.         -->
    <!-- ========================================================== -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      (function () {
        var defaultConsent = {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: "denied",
          functionality_storage: "denied",
          security_storage: "granted",
          wait_for_update: 500,
        };

        try {
          var raw = localStorage.getItem("user_cookie_preferences");
          if (raw) {
            var saved = JSON.parse(raw);
            if (saved && typeof saved.analytics === "boolean") {
              defaultConsent.analytics_storage = saved.analytics
                ? "granted"
                : "denied";
              defaultConsent.ad_storage = saved.marketing
                ? "granted"
                : "denied";
              defaultConsent.ad_user_data = saved.marketing
                ? "granted"
                : "denied";
              defaultConsent.ad_personalization = saved.marketing
                ? "granted"
                : "denied";
              defaultConsent.functionality_storage = saved.functional
                ? "granted"
                : "denied";
            }
          }
        } catch (e) {
          /* localStorage unavailable — keep all denied */
        }

        gtag("consent", "default", defaultConsent);
      })();
    </script>

    <!-- Google Tag Manager — loaded after consent defaults are set.
         GTM respects Consent Mode v2 and will not fire tags until the
         corresponding consent type is updated to "granted". -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-N422H5NK");
    </script>
    <!-- End Google Tag Manager -->

    <!-- Google Ads (gtag.js) — loaded after consent defaults. Tags
         will fire in consentless / ping mode until consent is granted. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=AW-18247449976"
    ></script>
    <script>
      gtag("js", new Date());
      gtag("config", "AW-18247449976");
    </script>

    <!-- Google Phone Call Conversion Snippet -->
    <script>
      gtag("config", "AW-18247449976/YBIuCIeayuMcEPj6h_1D", {
        phone_conversion_number: "+91 90045 75425",
      });
    </script>

    <!-- ========================================================== -->
    <!-- Meta Pixel — NOT loaded here. The React consent utility      -->
    <!-- injects it dynamically only when marketing consent is        -->
    <!-- granted. This prevents the pixel from firing before consent.  -->
    <!-- ========================================================== -->

    <meta charset="UTF-8" />

      rel="stylesheet"
    />
    <meta
      name="description"
      content="AStechnix — End-to-end managed IT outsourcing and technology delivery. Software engineering, managed infrastructure, QA, data engineering, and helpdesk support."
    />
    <title>AStechnix — Managed IT Outsourcing & Technology Delivery</title>

    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">

</head>
